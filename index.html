<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Underworld</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --ground:#0B0716; --pink:#FF3DCB; --cyan:#2EE6FF; --amber:#FFB020; --green:#4CFF9A; }
  html, body { margin:0; height:100%; background:var(--ground); color:#E9E4FF; font:15px/1.4 'Chakra Petch','Segoe UI',sans-serif; overflow:hidden; }
  canvas { display:block; position:fixed; inset:0; touch-action:none; }
  #top { position:fixed; left:0; right:0; top:0; padding:12px 14px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; pointer-events:none; z-index:3; }
  h1 { font:800 20px Orbitron,'Segoe UI',sans-serif; letter-spacing:3px; margin:0; color:var(--pink); text-shadow:0 0 14px #FF3DCB99; }
  #sub { color:#9A8FC2; font-size:12px; }
  #districts { display:flex; gap:6px; pointer-events:auto; flex-wrap:wrap; justify-content:flex-end; }
  button { min-height:44px; min-width:44px; padding:0 14px; border-radius:10px; border:1px solid #2B1D55; background:#150D2Bcc; color:#9A8FC2; font:600 13px 'Chakra Petch',sans-serif; cursor:pointer; }
  button.on { color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 12px #2EE6FF55; }
  #bottom { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(transparent, #0B0716 40%); z-index:3; }
  #fund { display:flex; align-items:center; gap:10px; font-size:12px; color:#9A8FC2; margin-bottom:8px; }
  #fund b { color:var(--amber); font-weight:600; }
  .step { width:26px; height:8px; border-radius:4px; background:#2B1D55; }
  .step.lit { background:var(--amber); box-shadow:0 0 10px var(--amber); }
  #ticker { white-space:nowrap; overflow:hidden; color:var(--green); font-size:13px; border-top:1px solid #2B1D55; padding-top:8px; }
  #ticker span { display:inline-block; padding-left:100%; animation:run 60s linear infinite; }
  @keyframes run { to { transform:translateX(-100%); } }
  .label { position:fixed; transform:translate(-50%,-100%); font:600 11px Orbitron,sans-serif; letter-spacing:1px; color:#E9E4FF; text-shadow:0 0 6px #000,0 0 10px #000; pointer-events:none; white-space:nowrap; z-index:1; }
  .label small { display:block; font:400 10px 'Chakra Petch',sans-serif; color:#FF8A94; letter-spacing:0; text-align:center; }
  /* what a resident is doing or thinking, floating over its head */
  .bubble { position:fixed; transform:translate(-50%,-100%); pointer-events:none; z-index:2; text-align:center; }
  .bubble i { display:inline-block; min-width:30px; padding:5px 8px; border-radius:10px; border:2px solid var(--c,#2EE6FF); background:#150D2Be6; color:#fff; font:700 15px 'Chakra Petch',sans-serif;
              font-style:normal; box-shadow:0 0 12px var(--c,#2EE6FF); position:relative; }
  .bubble i::after { content:""; position:absolute; left:50%; bottom:-8px; margin-left:-6px; border:6px solid transparent; border-top-color:var(--c,#2EE6FF); border-bottom:0; }
  .bubble b { display:block; margin-top:9px; font:600 11px 'Chakra Petch',sans-serif; color:var(--c,#E9E4FF); text-shadow:0 0 6px #000,0 0 8px #000; }
  #card { position:fixed; left:14px; right:14px; bottom:96px; max-width:420px; margin:auto; background:#150D2Bf2; border:1px solid var(--cyan); border-radius:14px; padding:14px; display:none; box-shadow:0 0 24px #2EE6FF33; z-index:4; }
  #card { max-height:52vh; overflow-y:auto; }
  #card h2 { font:800 15px Orbitron,sans-serif; letter-spacing:2px; margin:0 0 6px; color:var(--cyan); }
  #card .who { margin:6px 0; } #card .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:8px; }
  #paused { position:fixed; top:74px; left:50%; transform:translateX(-50%); background:#FF5964; color:#fff; padding:8px 18px; border-radius:10px; font:800 13px Orbitron,sans-serif; letter-spacing:2px; display:none; z-index:3; }
  #offline { position:fixed; inset:0; display:none; align-items:center; justify-content:center; text-align:center; color:#9A8FC2; padding:30px; pointer-events:none; z-index:2; }
</style>
</head>
<body>
<div id="top">
  <div><h1>NEON UNDERWORLD</h1><div id="sub">Motherboard City</div></div>
  <div id="districts">
    <button data-d="downtown" class="on">Motherboard</button><button data-d="docks">CPU</button><button data-d="alley">Neon Alley</button>
    <button id="askBtn" style="color:#FFB020;border-color:#FFB020" title="Ask the city to solve something">Ask the city</button>
    <button id="consoleBtn" style="display:none;color:#FF3DCB;border-color:#FF3DCB">Console</button>
  </div>
</div>
<div id="paused">CITY PAUSED</div>
<div id="offline"><div><b style="font:800 16px Orbitron,sans-serif;color:#FFB020;letter-spacing:2px">BOARD NOT POWERED</b><br><br>This district opens in a later phase.</div></div>
<div id="card"><h2></h2><div id="cardBody"></div></div>
<div id="bottom">
  <div id="fund"><span>Robot fund</span><span id="steps" style="display:flex;gap:4px"></span><span>next: <b id="goal"></b></span></div>
  <div id="ticker"><span id="tick"></span></div>
</div>
<!-- three.js r147, pinned. Models: assets/models.js (all CC0, see assets/CREDITS.md). Data: snapshot.js (no money, no account details). -->
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/utils/SkeletonUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/Pass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="assets/models.js"></script>
<script src="snapshot.js"></script>
<script>
const SNAP = window.SNAPSHOT || { citizens: [], feed: [], fund: { next_goal: "", progress_steps_of_5: 0 }, paused: false };
const MODELS = window.MODELS || {};
const C = { ground: 0x0B0716, board: 0x1B0F3A, pink: 0xFF3DCB, cyan: 0x2EE6FF, amber: 0xFFB020, green: 0x4CFF9A, dim: 0x3A2B66, red: 0xFF5964 };
const PAD = 0.7;                                     // every building stands on a raised hex pad this high

// Buildings are electronic components. x, z = place on the board; kind = what it is drawn as; r = size of its pad.
const BUILDINGS = {
  "workshop":         { name: "Engineering Workshop",     x: 0, z: 0, kind: "cpu",       r: 8.6 },
  "night-shift":      { name: "Listings & Sales",      x: -15, z: 15, kind: "ram",       r: 7.2 },
  "holo-studio":      { name: "Holo Studio",      x: 17, z: 14, kind: "gpu",       r: 7.4 },
  "fabricator":       { name: "The Fabricator",   x: 28, z: -15, board: "docks", kind: "coil",      r: 5.4 },
  "town-hall":        { name: "HQ · Leadership",        x: 0, z: -16, kind: "capacitor", r: 4.6 },
  "gate":             { name: "The Gate",         x: -31, z: 0, kind: "usb",       r: 5.2 },
  "bazaar":           { name: "The Bazaar",       x: -11, z: 12, board: "docks", kind: "header",    r: 6.4 },
  "hangar":           { name: "The Hangar",       x: -26, z: -4, board: "docks", kind: "socket",    r: 7.0 },
  "blueprint-office": { name: "Strategy & Pricing", x: -15, z: -16, kind: "chip",      r: 4.4 },
  "render-studio":    { name: "Render Studio",    x: 28, z: 8, board: "docks", kind: "chip",      r: 4.4 },
  "radio-tower":      { name: "Social Content",      x: 32, z: 14, kind: "tower",     r: 4.0 },
  "recruitment-office": { name: "Recruitment & Compliance", x: -31, z: 14, kind: "dip",      r: 4.4 },      // next to the Gate
  "research-team":    { name: "R&D Lab",    x: 15, z: -16, kind: "crystal",   r: 4.6 },
  "debate-room":      { name: "Debate Room",      x: 31, z: -16, kind: "debate",    r: 3.7 },      // the R&D Lab's round table, beside the Research Team
  "resist":           { name: "RESIST",           x: -31, z: -16, kind: "lounge",  r: 4.5 },      // the smoke club: a giant resistor over a lounge
  "datasanctuary":    { name: "DataSanctuary",    x: 28, z: -3, board: "docks", kind: "harddrive", r: 3.7 },      // the apartment tower: a hard drive stood on end. Designed by Byte, Zhilak, Aurum and NeonNova, merged by Tick
  "payphone":         { name: "The Payphone",   x: 26, z: 18, board: "docks", kind: "resistor",  r: 3.2 },
  "print-shop":       { name: "Print Shop",       x: -26, z: 9, board: "docks", kind: "chip",      r: 4.4 },
  "docks-resist":     { name: "CPU RESIST",     x: 16, z: 8, kind: "lounge", r: 4.5, board: "docks", power: true },      // the Docks' own smoke club, so their residents take a resist at home
  "training-yard":    { name: "Training Yard",    x: 0, z: -6.2, kind: "chip",   r: 3.4, board: "alley", power: true },      // Neon Alley: where the city's own model will train on the Foundry's records one day
  "docks":            { name: "The Docks",        x: 0, z: 0, kind: "dip",    r: 6.5, board: "docks", power: true },      // the small models' station (Jimm, 4 Oct); its own board under "The Docks" button since 4 Oct, powered; its own machine, arcade004, later
};

// ---------------------------------------------------------------- scene, light, glow
const scene = new THREE.Scene();
scene.background = new THREE.Color(C.ground);
scene.fog = new THREE.Fog(C.ground, 75, 170);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 500);
camera.position.set(-6, 40, 58);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);      // drag to rotate, pinch or scroll to zoom
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.47; controls.minDistance = 16; controls.maxDistance = 120; controls.target.set(0, 1, 0);
scene.add(new THREE.HemisphereLight(0xb9a8ff, 0x1a0f3a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 1.05); sun.position.set(26, 46, 22); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -52, right: 52, top: 40, bottom: -40, near: 1, far: 130 }); sun.shadow.bias = -0.0006; scene.add(sun);
const pinkLamp = new THREE.PointLight(C.pink, 1.2, 70); pinkLamp.position.set(-26, 12, -18); scene.add(pinkLamp);
const cyanLamp = new THREE.PointLight(C.cyan, 1.2, 70); cyanLamp.position.set(28, 12, 20); scene.add(cyanLamp);
// neon glow: only the bright neon parts bloom, the lit plastic does not
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, camera));
const bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.7, 0.5, 0.9);
composer.addPass(bloom);

const city = new THREE.Group(); scene.add(city);
const glow = (colour) => new THREE.MeshBasicMaterial({ color: colour });
const solid = (colour, emissive) => new THREE.MeshStandardMaterial({ color: colour, emissive: emissive || 0x000000, roughness: 0.6, metalness: 0.25 });
const shade = (m) => { m.castShadow = true; m.receiveShadow = true; return m; };
const box = (w, h, d, mat, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x || 0, y || 0, z || 0); return mat.isMeshStandardMaterial ? shade(m) : m; };
const cyl = (r, h, mat, x, y, z, seg) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg || 24), mat); m.position.set(x || 0, y || 0, z || 0); return mat.isMeshStandardMaterial ? shade(m) : m; };

// ---------------------------------------------------------------- the desk it sits on, and the board
const desk = new THREE.Mesh(new THREE.PlaneGeometry(420, 420), new THREE.MeshStandardMaterial({ color: 0x0d0820, roughness: 0.9 }));
desk.rotation.x = -Math.PI / 2; desk.position.y = -1.6; desk.receiveShadow = true; scene.add(desk);
const grid = new THREE.GridHelper(420, 70, 0x2B1D55, 0x1a1036); grid.position.y = -1.58; scene.add(grid);
city.add(box(76, 1.5, 50, solid(C.board), 0, -0.75, 0));
const edge = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(76, 1.5, 50)), new THREE.LineBasicMaterial({ color: C.pink }));
edge.position.y = -0.75; city.add(edge);
for (let i = -35; i <= 35; i += 5) for (let j = -22; j <= 22; j += 5.5) city.add(cyl(0.16, 0.05, glow(C.dim), i, 0.03, j, 10));       // solder pads
for (const [x, z] of [[-36, -23], [36, -23], [-36, 23], [36, 23]]) { city.add(cyl(1.1, 0.2, solid(0x565c7a), x, 0.1, z)); city.add(cyl(0.5, 0.25, solid(0x06040e), x, 0.12, z)); }   // mounting holes

// ---------------------------------------------------------------- side districts: each its own powered board, shown by its button at the top
// The Docks (Jimm, 4 Oct: "power it and move the AI in") and Neon Alley (Jimm, 4 Oct: "show it as a city"; HP laptop B in the brief, home of the city's own model one day)
let SHOWING = "downtown";                             // which board is on screen
const BOARDS = { downtown: city }, POWER = {}, jackTags = [];
function sideBoard(d, w, depth, edge, jackAt, lamps) {
  const g = new THREE.Group(); g.visible = false; scene.add(g); BOARDS[d] = g;
  g.add(box(w, 1.5, depth, solid(C.board), 0, -0.75, 0));
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w, 1.5, depth)), new THREE.LineBasicMaterial({ color: edge })); e.position.y = -0.75; g.add(e);
  for (let i = -w / 2 + 3; i <= w / 2 - 3; i += 5) for (let j = -depth / 2 + 3; j <= depth / 2 - 3; j += 5.2) g.add(cyl(0.16, 0.05, glow(C.dim), i, 0.03, j, 10));
  for (const [x, z] of [[-w / 2 + 2, -depth / 2 + 2], [w / 2 - 2, -depth / 2 + 2], [-w / 2 + 2, depth / 2 - 2], [w / 2 - 2, depth / 2 - 2]]) { g.add(cyl(1.1, 0.2, solid(0x565c7a), x, 0.1, z)); g.add(cyl(0.5, 0.25, solid(0x06040e), x, 0.12, z)); }
  POWER[d] = { at: jackAt, colour: edge };                                // the jack the district draws from; the live rail runs from here to its building
  g.add(box(3.2, 2.2, 3.6, solid(0x2a2a3a), jackAt[0], 1.1, jackAt[1]));
  const j = cyl(0.9, 0.5, glow(edge), jackAt[0] + 1.7, 1.2, jackAt[1]); j.rotation.z = Math.PI / 2; g.add(j);
  lamps.forEach(([col, x, y, z]) => { const l = new THREE.PointLight(col, 1.3, 40); l.position.set(x, y, z); g.add(l); });
  const t = document.createElement("div"); t.className = "label"; t.dataset.d = d; t.style.visibility = "hidden";
  t.innerHTML = 'Power<small style="color:#' + new THREE.Color(edge).getHexString() + '">live</small>'; document.body.appendChild(t); jackTags.push([t, jackAt]);
  return g;
}
const dock = sideBoard("docks", 70, 44, C.amber, [-31, 19.5], [[C.amber, 0, 12, 4], [C.cyan, 18, 10, -8], [C.pink, -20, 10, 6]]);     // the CPU board (was the Docks), 4 Oct: bigger, 9 buildings
const alley = sideBoard("alley", 62, 20, C.pink, [-27, 6], [[C.pink, -14, 7, 0], [C.cyan, 14, 7, 0], [C.amber, 0, 9, 6]]);
// Neon Alley's street: a glowing lane down the middle and two rows of shopfronts with neon signs. Scenery only: nobody lives here yet.
alley.add(box(56, 0.06, 3.2, glow(0x2a1650), 0, 0.04, 0)); alley.add(box(56, 0.08, 0.18, glow(C.pink), 0, 0.06, 1.7)); alley.add(box(56, 0.08, 0.18, glow(C.cyan), 0, 0.06, -1.7));
const SIGNS = [C.pink, C.cyan, C.amber, C.green, 0xB06CFF];
for (const side of [-1, 1]) for (let i = 0; i < 9; i++) {
  const x = -24 + i * 6 + (side > 0 ? 3 : 0); if (side < 0 && Math.abs(x) < 6) continue;             // leave room for the Training Yard
  const h = 3 + ((i * 7 + (side > 0 ? 3 : 0)) % 5) * 1.1, z = side * 6.2, col = SIGNS[(i + (side > 0 ? 2 : 0)) % SIGNS.length];
  alley.add(box(4.6, h, 4.2, solid(0x1c1238, 0x05030c), x, h / 2, z));
  alley.add(box(3.2, 0.5, 0.12, glow(col), x, h - 0.9, z - side * 2.16));                            // the shop sign, facing the street
  alley.add(box(2.4, 1.5, 0.1, glow(new THREE.Color(col).multiplyScalar(0.35).getHex()), x, 1.0, z - side * 2.16));   // a lit window
  if (i % 2) { const lamp = cyl(0.08, 3.6, solid(0x565c7a), x + 2.6, 1.8, side * 3.4, 8); alley.add(lamp); const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 8), glow(col)); bulb.position.set(x + 2.6, 3.7, side * 3.4); alley.add(bulb); }
}

// The Docks as a soundboard (Jimm, 4 Oct: "offices and places for them to work... like a soundboard design with a resist area also").
// One channel strip per Docks resident along the back: fader, knobs and a screen. That strip is the resident's desk; it walks between its desk and the tower.
const DOCK_DESKS = [], dockFaders = [];
for (let i = 0; i < 10; i++) {
  const x = -18 + i * 4, col = SIGNS[i % SIGNS.length];
  dock.add(box(3.0, 0.5, 6.0, solid(0x15102a), x, 0.25, -12));                                   // the strip
  dock.add(box(0.22, 0.06, 3.4, glow(C.dim), x - 0.6, 0.53, -11.6));                               // fader slot
  const cap = box(1.0, 0.4, 0.55, glow(col), x - 0.6, 0.7, -11.6); dock.add(cap); dockFaders.push({ cap, phase: i * 1.7, speed: 0.5 + (i % 3) * 0.25 });
  for (const kz of [-14.2, -13.4]) { dock.add(cyl(0.34, 0.32, solid(0x2a2a3a), x + 0.75, 0.66, kz, 14)); dock.add(box(0.08, 0.06, 0.3, glow(col), x + 0.75, 0.84, kz - 0.12)); }
  for (let v = 0; v < 5; v++) dock.add(box(0.36, 0.14, 0.36, glow(v < 3 ? C.green : v < 4 ? C.amber : C.red), x + 0.75, 0.56, -11.9 + v * 0.55));   // VU meter
  dock.add(box(2.6, 1.6, 0.14, solid(0x0b0716), x, 1.55, -15.1)); dock.add(box(2.3, 1.3, 0.05, glow(new THREE.Color(col).multiplyScalar(0.45).getHex()), x, 1.55, -15.0));   // the resident's screen
  dock.add(cyl(0.7, 0.55, solid(0x2a2a3a), x, 0.28, -8.4, 16)); dock.add(cyl(0.75, 0.1, glow(col), x, 0.58, -8.4, 16));          // the resident's stool
  dock.add(box(2.2, 0.12, 0.8, solid(0x0b0716), x - 0.2, 0.56, -9.7)); dock.add(box(2.0, 0.04, 0.6, glow(new THREE.Color(col).multiplyScalar(0.3).getHex()), x - 0.2, 0.64, -9.7));   // keyboard
  dock.add(cyl(0.05, 1.6, solid(0x8a90a8), x + 1.25, 1.05, -10.0, 8));   // mic stand
  { const m = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), solid(0x2a2a3a)); m.position.set(x + 1.25, 1.9, -10.0); dock.add(m); }
  DOCK_DESKS.push(new THREE.Vector3(x, 0.6, -8.4));                                               // where its resident sits, facing its screen
}
const deskOf = { n: 0 };
const DISTRICT = (key) => (BUILDINGS[key] && BUILDINGS[key].board) || "downtown";
const boardOf = (key) => BOARDS[DISTRICT(key)];

// ---------------------------------------------------------------- traces, and the light that runs along them
const paths = {}, pulses = [];
function trace(key, colour, live) {
  const b = BUILDINGS[key], P = boardOf(key), pw = b.power ? POWER[DISTRICT(key)] : null, docks = !!pw;      // `docks`: any side district, fed by a power rail
  const pts = pw ? [new THREE.Vector3(b.x, 0.08, b.z + b.r + 0.6), new THREE.Vector3(b.x, 0.08, pw.at[1]), new THREE.Vector3(pw.at[0] + 2, 0.08, pw.at[1])]   // a power rail from the jack
                 : [new THREE.Vector3(b.x, 0.08, b.z), new THREE.Vector3(b.x, 0.08, 0), new THREE.Vector3(0, 0.08, 0)];
  if (pw) { colour = pw.colour; live = true; }                             // power, not data: a side district's rail is always on
  paths[key] = pts;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], c = pts[i + 1];
    if (a.distanceTo(c) < 0.01) continue;
    P.add(box(Math.abs(c.x - a.x) + (docks ? 0.7 : 0.34), docks ? 0.12 : 0.07, Math.abs(c.z - a.z) + (docks ? 0.7 : 0.34), glow(colour), (a.x + c.x) / 2, 0.05, (a.z + c.z) / 2));
  }

    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.32, 10, 8), glow(docks ? 0xFFE0A0 : 0xffffff)); P.add(dot);

      if (w.stop > 0) { w.stop -= dt; play(w, "Idle"); }
      else {
        const to = w.route[w.leg % w.route.length], step = to.clone().sub(w.g.position).setY(0);
        if (step.length() < 0.4) { w.leg++; w.stop = 3 + Math.random() * 4; }
        else { w.g.rotation.y = Math.atan2(step.x, step.z); w.g.position.add(step.normalize().multiplyScalar(Math.min(dt * 2.2, step.length()))); play(w, "Walking"); }
      }
    } else if (w.desk) {                                                    // at the mixing desk: seated, facing its screen
      w.g.position.copy(w.desk); w.g.rotation.y = Math.PI; play(w, w.actions.Sitting ? "Sitting" : "Idle");
    } else if (w.waiting || w.debating || !w.path || !w.speed || stopped) {
      play(w, (w.waiting && Math.sin(now * 0.35 + w.offset * 3) > 0.93) || (w.debating && Math.sin(now * 0.6 + w.t * 9) > 0.6) ? "Wave" : "Idle");     // a wave at the table is a raised hand
    } else {
      w.t = (w.t + dt * w.speed) % 2;
      const u = w.t <= 1 ? w.t : 2 - w.t, p = along(w.path, u), q = along(w.path, Math.min(1, Math.max(0, u + (w.t <= 1 ? 0.01 : -0.01))));
      const alongX = Math.abs(q.x - p.x) > Math.abs(q.z - p.z);
      w.g.position.set(p.x + (alongX ? 0 : w.offset), 0, p.z + (alongX ? w.offset : 0));
      if (q.distanceTo(p) > 0.0001) w.g.rotation.y = Math.atan2(q.x - p.x, q.z - p.z);
      play(w, "Walking");
    }
    place(w.tag, w.g.position.x, 4.7 + w.g.position.y, w.g.position.z);
  });
  pulses.forEach(p => { if (!stopped) p.t = (p.t + dt * p.speed) % 1; p.dot.position.copy(along(p.path, p.t)).setY(0.3); });
  movers.forEach(o => {
    if (!stopped) o.t += dt;
    if (o.kind === "rover") {                                             // laps just inside the edge of the board
      const lap = 36 * 2 + 23 * 2, d = (o.t * 4) % (lap * 2), X = 36, Z = 23;
      const seg = d < 2 * X ? [-X + d, -Z, 0] : d < 2 * X + 2 * Z ? [X, -Z + (d - 2 * X), 1] : d < 4 * X + 2 * Z ? [X - (d - 2 * X - 2 * Z), Z, 2] : [-X, Z - (d - 4 * X - 2 * Z), 3];
      o.m.position.x = seg[0]; o.m.position.z = seg[1]; o.m.rotation.y = [Math.PI / 2, 0, -Math.PI / 2, Math.PI][seg[2]];
    } else {
      o.m.position.set(Math.cos(o.t * 0.35) * 30, 13 + Math.sin(o.t * 0.9) * 1.2, Math.sin(o.t * 0.35) * 20); o.m.rotation.y = -o.t * 0.35;
    }
    if (o.tag) place(o.tag, o.m.position.x, o.m.position.y + 1.6, o.m.position.z);
  });
  if (lit.tip) lit.tip.visible = Math.sin(now * 4) > -0.3;
  if (lit.fan && !stopped) lit.fan.rotation.y += dt * 6;
  insignias.forEach((s, k) => { s.rotation.y += dt * 0.9; s.position.y += Math.sin(now * 1.5 + k) * 0.004; });
  if (lit.docksFans && !stopped) lit.docksFans.forEach(b => b.rotation.y += dt * 5);
  if (lit.lens && !stopped) lit.lens.rotation.z += dt * 0.8;
  if (lit.ring && IN_SESSION) lit.ring.scale.setScalar(1 + Math.sin(now * 2.2) * 0.05);
  if (lit.windows) {                                                       // the DataSanctuary, alive
    lit.windows.forEach(w => { if (!w.asleep) w.pane.material.color.setHex(0x2EE6FF).multiplyScalar(0.35 + 0.3 * (1 + Math.sin(now * 1.6 + w.phase)) / 2); });
    lit.spiral.forEach(s => { const u = ((s.i / 26 + (stopped ? 0 : now * 0.05)) % 1); s.bead.position.set(s.x + Math.cos(u * Math.PI * 10) * 0.42, 0.3 + u * s.h, Math.sin(u * Math.PI * 10) * 0.42); });
    lit.stream.forEach(s => { s.drop.position.y = 1.2 + ((s.i / 5 + (stopped ? 0 : now * 0.22)) % 1) * s.h; });
    if (!stopped) { lit.platter.rotation.y += dt * 2.4; lit.arm.rotation.y = Math.sin(now * 0.7) * 0.5; }
    lit.dome.material.opacity = 0.16 + 0.1 * (1 + Math.sin(now * 2.4)) / 2;
  }
  if (!stopped && Math.random() < dt * 1.6) puff(B.resist.x + (Math.random() - 0.5) * 1.2, PAD + 0.7, B.resist.z + (Math.random() - 0.5) * 1.2, Math.random() < 0.5 ? C.pink : C.cyan, false);
  if (!stopped && Math.random() < dt * 1.6) puff(B["docks-resist"].x + (Math.random() - 0.5) * 1.2, PAD + 0.7, B["docks-resist"].z + (Math.random() - 0.5) * 1.2, Math.random() < 0.5 ? C.amber : C.cyan, false, dock);
  if (!stopped) dockFaders.forEach(f => f.cap.position.z = -11.6 + Math.sin(now * f.speed + f.phase) * 1.4);      // the Docks' faders ride up and down
  for (let k = smoke.length - 1; k >= 0; k--) {
    const s = smoke[k]; s.m.position.y += dt * (s.ring ? 0.75 : 0.5); s.m.position.x += dt * s.drift; s.m.scale.multiplyScalar(1 + dt * (s.ring ? 0.45 : 0.3)); s.m.material.opacity -= dt * (s.ring ? 0.2 : 0.09);
    if (s.m.material.opacity <= 0) { s.m.parent.remove(s.m); s.m.geometry.dispose(); s.m.material.dispose(); smoke.splice(k, 1); }
  }
  jackTags.forEach(([t, at]) => place(t, at[0], 3.4, at[1]));
  built.forEach(g => place(g.userData.label, g.position.x, g.userData.height, g.position.z));
  controls.update(); composer.render(); requestAnimationFrame(frame);
}
frame();
</script>
